name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-lint-test:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p nearx --features native --all-targets -- -D warnings

      - name: Test
        run: cargo test -p nearx --features native

      - name: Check native-host
        run: cargo check --manifest-path native-host/Cargo.toml

  desktop-checks:
    name: Desktop Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Test nearxd
        run: cargo test -p nearx --bin nearxd

      - name: Check Tauri host
        run: cargo check --manifest-path tauri-workspace/src-tauri/Cargo.toml

      - name: Check native-host
        run: cargo check --manifest-path native-host/Cargo.toml

      - name: Verify sidecar bundling helper
        run: node tools/build-sidecar.mjs

  web-typecheck-build:
    name: Web Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build explorer frontend
        run: yarn workspace explorer-frontend build
